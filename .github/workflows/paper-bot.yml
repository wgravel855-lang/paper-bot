name: paper-bot
on:
  schedule:
    - cron: "17 * * * *"     # every hour (strategy decides on 6-hour candles)
  workflow_dispatch: {}       # "Run workflow" button
permissions:
  contents: write
concurrency: paper-bot        # never overlaps with training
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py --once
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A data/live_* index.html
          git diff --cached --quiet && exit 0
          git commit -m "paper-bot: update $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
