name: train
on:
  schedule:
    - cron: "41 3 * * 0"     # every Sunday 03:41 UTC
  workflow_dispatch: {}       # "Run workflow" button to retrain now
permissions:
  contents: write
concurrency: paper-bot
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache (only new candles get downloaded)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: python train.py
      - name: Save models
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/models
          git diff --cached --quiet && exit 0
          git commit -m "train: weekly retrain $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
